<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Books</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header" style="margin-bottom: 2rem;">
            <h1 id="course-title" style="color: var(--primary);">Course Books</h1>
            <p>Recommended books,you should read <em>before</em> your first day of college!.</p>
            
            <button onclick="window.location.href='/'" style="width: auto; padding: 0.5rem 1.5rem; background-color: var(--text-muted); margin-top: 1rem; border-radius: 20px;">
                &larr; Back to Results
            </button>
        </header>

        <main style="max-width: 800px; margin: auto;">
            <div class="form-card">
                <div id="books-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem;">
                    </div>
            </div>
        </main>
    </div>

    <script src="/static/books.js"></script>
</body>
</html>
